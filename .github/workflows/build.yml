name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ["project.zip"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unzip
        run: unzip -q project.zip -d proj
      - name: Build
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk NovaDeck.apk
          gh release create "v${{ github.run_number }}" NovaDeck.apk --title "NovaDeck build ${{ github.run_number }}" --notes "Debug APK"
